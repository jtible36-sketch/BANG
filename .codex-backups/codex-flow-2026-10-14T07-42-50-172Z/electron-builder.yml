appId: id.bangtutorial.bangstory
productName: Naraflow
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/ffmpeg-static/{README.md,example.js,install.js,ffmpeg.exe.README}'
extraResources:
  - from: resources/branding
    to: branding
  - from: resources/health-characters
    to: health-characters
  - from: resources/fonts
    to: fonts
  - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
    to: licenses/FFmpeg-LICENSE.txt
  - from: resources/licenses
    to: licenses
  - from: resources/whisper
    to: whisper
asarUnpack:
  - node_modules/ffmpeg-static/**
  - '**/*.node'
win:
  icon: resources/branding/naraflow.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Naraflow-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Naraflow
npmRebuild: false
